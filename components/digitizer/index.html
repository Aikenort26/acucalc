<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: transparent; }
  #wrap { position: relative; display: inline-block; cursor: crosshair; }
  #img { display: block; max-width: 100%; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #loupe { position: absolute; left: 8px; top: 8px; border: 2px solid #22C55E;
           border-radius: 4px; background: #000; pointer-events: auto; z-index: 10;
           cursor: grab; }
  #loupe.dragging { cursor: grabbing; }
</style>
</head>
<body>
<div id="wrap">
  <img id="img" alt="curva"/>
  <canvas id="overlay"></canvas>
  <canvas id="loupe" width="180" height="180"></canvas>
</div>
<script>
// Componente Streamlit vanilla: lupa en tiempo real + markers + click→(x,y).
const ZOOM = 4, L = 180;
let args = null;
const img = document.getElementById('img'),
      ov = document.getElementById('overlay'),
      loupe = document.getElementById('loupe'),
      wrap = document.getElementById('wrap');

function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), '*');
}
function setValue(v) { send('streamlit:setComponentValue', {value: v, dataType: 'json'}); }
function frameHeight() { send('streamlit:setFrameHeight', {height: document.body.scrollHeight + 4}); }

function drawMarkers() {
  ov.width = img.clientWidth; ov.height = img.clientHeight;
  const c = ov.getContext('2d');
  c.clearRect(0, 0, ov.width, ov.height);
  if (!args || !img.naturalWidth) return;
  const s = img.clientWidth / img.naturalWidth;
  const cross = (x, y, color, label) => {
    x *= s; y *= s;
    c.strokeStyle = color; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x - 9, y); c.lineTo(x + 9, y);
    c.moveTo(x, y - 9); c.lineTo(x, y + 9);
    c.stroke();
    if (label) { c.fillStyle = color; c.font = 'bold 12px sans-serif'; c.fillText(label, x + 11, y - 6); }
  };
  const dot = (x, y, color) => {
    x *= s; y *= s;
    c.strokeStyle = color; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, 5, 0, 6.2832); c.stroke();
  };
  (args.markers.cal || []).forEach(m => cross(m.x, m.y, '#FF3333', m.label));
  (args.markers.qh || []).forEach(p => dot(p[0], p[1], '#00E5FF'));
  (args.markers.qe || []).forEach(p => dot(p[0], p[1], '#4ADE80'));
  if (args.markers.pending) cross(args.markers.pending[0], args.markers.pending[1], '#FFD400', '');
}

img.addEventListener('load', () => { drawMarkers(); frameHeight(); });

let curPx = 0, curPy = 0;   // última posición (px imagen) bajo el mouse en #wrap
let dragging = false, dragPx = 0, dragPy = 0;

function redrawLoupeAt(px, py) {
  const lc = loupe.getContext('2d');
  lc.imageSmoothingEnabled = false;
  lc.fillStyle = '#fff'; lc.fillRect(0, 0, L, L);
  const src = L / ZOOM;
  lc.drawImage(img, px - src / 2, py - src / 2, src, src, 0, 0, L, L);
  lc.strokeStyle = '#FFD400'; lc.lineWidth = 1;
  lc.beginPath();
  lc.moveTo(L / 2, 0); lc.lineTo(L / 2, L);
  lc.moveTo(0, L / 2); lc.lineTo(L, L / 2);
  lc.stroke();
  lc.fillStyle = '#B45309'; lc.font = 'bold 11px monospace';
  lc.fillText('(' + Math.round(px) + ', ' + Math.round(py) + ')', 4, L - 6);
}

wrap.addEventListener('mousemove', e => {
  if (!img.naturalWidth || dragging) return;   // arrastrando: la lupa la maneja el drag
  const r = img.getBoundingClientRect();
  const s = img.naturalWidth / img.clientWidth;
  curPx = (e.clientX - r.left) * s; curPy = (e.clientY - r.top) * s;
  redrawLoupeAt(curPx, curPy);
});

wrap.addEventListener('click', e => {
  if (!img.naturalWidth) return;
  const r = img.getBoundingClientRect();
  const s = img.naturalWidth / img.clientWidth;
  setValue({x: Math.round((e.clientX - r.left) * s),
            y: Math.round((e.clientY - r.top) * s), n: Date.now(), enterPressed: false});
});

// Arrastre en la lupa (WP-5): además del click sobre la imagen, el usuario
// puede afinar el punto arrastrando DENTRO de la lupa (vista ampliada
// ZOOM=4x, mucho más preciso que mover el mouse sobre la imagen a tamaño
// real). mousedown arranca el arrastre desde la última posición hover;
// mousemove mueve el centro de la lupa en la escala reducida por el zoom
// (1 px de pantalla arrastrado = 1/ZOOM px de imagen — precisión subpíxel
// efectiva); mouseup emite la posición final con el mismo contrato
// {x, y, n, enterPressed:false} que un click normal, así el lado Python la
// trata igual (se vuelve el punto pendiente).
loupe.addEventListener('mousedown', e => {
  if (!img.naturalWidth) return;
  dragging = true; dragPx = curPx; dragPy = curPy;
  loupe.classList.add('dragging');
  redrawLoupeAt(dragPx, dragPy);
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  dragPx = Math.min(Math.max(dragPx + e.movementX / ZOOM, 0), img.naturalWidth - 1);
  dragPy = Math.min(Math.max(dragPy + e.movementY / ZOOM, 0), img.naturalHeight - 1);
  redrawLoupeAt(dragPx, dragPy);
});

window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  loupe.classList.remove('dragging');
  curPx = dragPx; curPy = dragPy;
  setValue({x: Math.round(dragPx), y: Math.round(dragPy), n: Date.now(), enterPressed: false});
});

// WP-B2: Enter físico dentro del iframe del componente pasa de calibrar/
// capturar Q-H a calibrar Q-η (el lado Python decide el destino exacto
// según la etapa actual). Se distingue del click por enterPressed=true —
// no reutiliza x/y (irrelevantes) para no romper el contrato existente
// {x, y, n} que ya consume la página.
window.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  setValue({enterPressed: true, n: Date.now()});
});

window.addEventListener('message', e => {
  const d = e.data;
  if (d.type !== 'streamlit:render') return;
  args = d.args;
  if (img.getAttribute('src') !== args.image) img.setAttribute('src', args.image);
  else { drawMarkers(); frameHeight(); }
});

send('streamlit:componentReady', {apiVersion: 1});
frameHeight();
</script>
</body>
</html>
