<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: transparent; font-family: sans-serif; }
  #zone {
    box-sizing: border-box; width: 100%; padding: 14px; text-align: center;
    border: 2px dashed #38BDF8; border-radius: 8px; color: #9FBFB6;
    cursor: text; outline: none; transition: border-color 0.15s ease;
  }
  #zone:focus { border-color: #22C55E; }
  #zone.ok { border-color: #22C55E; color: #4ADE80; }
</style>
</head>
<body>
<div id="zone" tabindex="0">📋 Click aquí y pega (Ctrl+V) una captura de pantalla de la curva</div>
<script>
// Componente Streamlit vanilla: pega una imagen del portapapeles → base64,
// mismo contrato setValue/frameHeight que components/digitizer.
const zone = document.getElementById('zone');
const zoneLabel = zone.textContent;

function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), '*');
}
function setValue(v) { send('streamlit:setComponentValue', {value: v, dataType: 'json'}); }
function frameHeight() { send('streamlit:setFrameHeight', {height: document.body.scrollHeight + 4}); }

zone.addEventListener('paste', e => {
  const items = (e.clipboardData || window.clipboardData).items;
  for (const item of items) {
    if (!item.type.startsWith('image/')) continue;
    const blob = item.getAsFile();
    const reader = new FileReader();
    reader.onload = () => {
      // dataURL = "data:image/png;base64,AAAA..." — solo el b64 crudo, igual
      // que ya decodifica bomba.imagen_b64 en el lado Python.
      const b64 = reader.result.split(',')[1];
      setValue({b64: b64, n: Date.now()});
      zone.textContent = '✓ Imagen pegada';
      zone.classList.add('ok');
      setTimeout(() => { zone.textContent = zoneLabel; zone.classList.remove('ok'); }, 1500);
    };
    reader.readAsDataURL(blob);
    e.preventDefault();
    break;
  }
});

window.addEventListener('message', e => {
  if (e.data.type !== 'streamlit:render') return;
  frameHeight();
});

send('streamlit:componentReady', {apiVersion: 1});
frameHeight();
</script>
</body>
</html>
